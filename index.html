<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Fraud Detection Form</h1>
    <form action="/predict" method="post">
        <label for="step">Step:</label>
        <input type="number" id="step" name="step" required><br>
        <label for="type">Type:</label>
        <select id="type" name="type" required>
            <option value="PAYMENT">PAYMENT</option>
            <option value="TRANSFER">TRANSFER</option>
            <option value="CASH_OUT">CASH_OUT</option>
            <option value="DEBIT">DEBIT</option>
        </select><br>
        <label for="amount">Amount:</label>
        <input type="number" step="0.01" id="amount" name="amount" required><br>
        <label for="oldbalanceOrg">Old Balance Orig:</label>
        <input type="number" step="0.01" id="oldbalanceOrg" name="oldbalanceOrg" required><br>
        <label for="newbalanceOrig">New Balance Orig:</label>
        <input type="number" step="0.01" id="newbalanceOrig" name="newbalanceOrig" required><br>
        <label for="oldbalanceDest">Old Balance Dest:</label>
        <input type="number" step="0.01" id="oldbalanceDest" name="oldbalanceDest" required><br>
        <label for="newbalanceDest">New Balance Dest:</label>
        <input type="number" step="0.01" id="newbalanceDest" name="newbalanceDest" required><br>
        <input type="submit" value="Check Fraud">
    </form>
</body>
</html>
